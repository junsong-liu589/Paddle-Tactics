services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pingpong
      POSTGRES_PASSWORD: pingpong_dev
      POSTGRES_DB: pingpong_duel
    ports:
      - "5432:5432"
    volumes:
      - pingpong_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingpong -d pingpong_duel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pingpong_pgdata:
